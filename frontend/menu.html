<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منوی رستوران</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  
  <style>
    :root {
      --brand-color: #4f46e5; /* رنگ پیش‌فرض (بنفش) */
    }
    
    body { font-family: 'Vazirmatn', sans-serif; transition: background-color 0.3s, color 0.3s; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* کلاس‌های رنگ اختصاصی رستوران */
    .bg-brand { background-color: var(--brand-color) !important; }
    .text-brand { color: var(--brand-color) !important; }
    .border-brand { border-color: var(--brand-color) !important; }
    
    /* حالت شب */
    .dark-mode { background-color: #0f172a !important; color: #f8fafc !important; }
    .dark-mode .bg-white { background-color: #1e293b !important; border-color: #334155 !important; }
    .dark-mode .text-slate-800 { color: #f8fafc !important; }
    .dark-mode .text-slate-500 { color: #94a3b8 !important; }
    .dark-mode .bg-slate-50 { background-color: #0f172a !important; }
    .dark-mode .bg-indigo-50 { background-color: #1e293b !important; }
    
    /* انیمیشن‌ها */
    .slide-up-enter { animation: slideUp 0.3s ease-out forwards; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }
    .toast-enter { animation: toastIn 0.4s ease-out forwards; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24">

  <!-- مودال خوش‌آمدگویی -->
  <div id="welcome-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl text-center">
      <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl">👋</div>
      <h2 class="text-2xl font-black text-slate-800 mb-2">خوش آمدید!</h2>
      <p class="text-sm text-slate-500 mb-6">لطفاً برای مشاهده منو و سفارش، مشخصات خود را وارد کنید.</p>
      
      <div class="space-y-4 text-right">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">نام و نام خانوادگی</label>
          <input type="text" id="customer-name" placeholder="مثلا: نیما قربانی" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">شماره میز (اختیاری)</label>
          <input type="number" id="customer-table" placeholder="مثلا: ۴" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>
      <button onclick="saveCustomerInfo()" class="w-full mt-6 bg-brand text-white font-bold py-3.5 rounded-xl shadow-lg transition-all active:scale-95">ورود به منو</button>
    </div>
  </div>

  <!-- هدر رستوران -->
  <header class="bg-brand text-white p-6 rounded-b-3xl shadow-lg sticky top-0 z-40">
    <div class="max-w-2xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-extrabold" id="restaurant-name">در حال بارگذاری...</h1>
        <p class="text-white/80 mt-1 text-sm" id="welcome-message">به منوی ما خوش آمدید 🌿</p>
      </div>
      <button id="theme-toggle" class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center text-white backdrop-blur-sm">🌙</button>
    </div>
  </header>

  <div class="max-w-2xl mx-auto px-4 mt-6">
    <!-- نوار جستجو -->
    <div class="relative mb-6">
      <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
      <input type="text" id="search-input" placeholder="دنبال چه غذایی می‌گردید؟" class="w-full bg-white border border-slate-200 text-slate-800 rounded-2xl py-3 pr-12 pl-4 focus:outline-none focus:ring-2 focus:ring-brand shadow-sm transition-all">
    </div>

    <!-- تب‌های دسته‌بندی -->
    <div id="category-tabs" class="flex overflow-x-auto hide-scrollbar gap-2 mb-6 pb-2"></div>

    <!-- لیست غذاها -->
    <div id="menu-list" class="space-y-4">
      <p class="text-center text-slate-500 py-10">در حال دریافت منو...</p>
    </div>
  </div>

  <!-- صفحه جزئیات غذا (تمام‌صفحه) -->
  <div id="item-page" class="fixed inset-0 bg-white z-[100] hidden flex-col overflow-y-auto slide-up-enter">
    
    <div class="relative w-full h-[45vh] bg-slate-200 shrink-0">
      <div id="item-image-container" class="w-full h-full"></div>
      
      <button onclick="closeItemPage()" class="absolute top-6 right-6 w-12 h-12 bg-white/90 backdrop-blur-md text-slate-800 rounded-full flex items-center justify-center shadow-lg z-10 transition-transform active:scale-90">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
      </button>

      <button onclick="toggleFavorite()" id="fav-btn" class="absolute top-6 left-6 w-12 h-12 bg-white/90 backdrop-blur-md text-slate-400 rounded-full flex items-center justify-center shadow-lg z-10 transition-all active:scale-90">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg>
      </button>

      <div class="absolute bottom-6 right-6 bg-white/90 backdrop-blur-md px-4 py-2 rounded-2xl shadow-lg flex gap-1 z-10" id="rating-stars">
        <span onclick="rateItem(1)" class="text-2xl cursor-pointer text-slate-300 transition-colors">★</span>
        <span onclick="rateItem(2)" class="text-2xl cursor-pointer text-slate-300 transition-colors">★</span>
        <span onclick="rateItem(3)" class="text-2xl cursor-pointer text-slate-300 transition-colors">★</span>
        <span onclick="rateItem(4)" class="text-2xl cursor-pointer text-slate-300 transition-colors">★</span>
        <span onclick="rateItem(5)" class="text-2xl cursor-pointer text-slate-300 transition-colors">★</span>
      </div>
    </div>

    <div class="flex-1 bg-white rounded-t-3xl -mt-6 relative z-10 p-6 pb-32">
      <div class="flex justify-between items-start mb-2">
        <h2 id="item-title" class="text-3xl font-black text-slate-800">نام غذا</h2>
      </div>
      
      <div id="item-tags" class="flex flex-wrap gap-2 mb-4"></div>
      
      <p id="item-description" class="text-slate-600 text-sm leading-relaxed mb-8">توضیحات غذا...</p>
      
      <div id="item-ingredients-container" class="bg-slate-50 p-5 rounded-2xl border border-slate-100 mb-8 hidden">
        <h3 class="text-sm font-bold text-slate-800 mb-2 flex items-center gap-2">
          <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
          مواد اولیه
        </h3>
        <p id="item-ingredients" class="text-sm text-slate-500 leading-relaxed">...</p>
      </div>

      <div class="flex items-center justify-between bg-slate-50 p-4 rounded-2xl border border-slate-100 mt-6">
        <span class="font-bold text-slate-700">تعداد سفارش:</span>
        <div class="flex items-center gap-4 bg-white border border-slate-200 rounded-xl p-1 shadow-sm">
          <button onclick="changeQty(-1)" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-slate-100 rounded-lg text-xl font-bold transition-colors">-</button>
          <span id="qty-display" class="w-8 text-center font-black text-lg text-brand">1</span>
          <button onclick="changeQty(1)" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:bg-slate-100 rounded-lg text-xl font-bold transition-colors">+</button>
        </div>
      </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 pb-6 z-20 flex items-center justify-between shadow-[0_-10px_20px_rgba(0,0,0,0.05)]">
      <div class="flex flex-col">
        <span class="text-[10px] text-slate-500 font-bold">مبلغ نهایی</span>
        <div class="text-2xl font-black text-brand" id="item-price">۰ تومان</div>
      </div>
      <button onclick="addToCart()" class="bg-brand text-white font-bold px-8 py-3.5 rounded-xl shadow-lg active:scale-95 transition-transform">
        افزودن به سبد
      </button>
    </div>
  </div>

  <!-- سبد خرید شناور (پایین صفحه) -->
  <div id="floating-cart" class="fixed bottom-6 right-6 left-6 z-50 transform translate-y-24 transition-transform duration-300">
    <button onclick="openCartModal()" class="bg-brand text-white w-full max-w-md mx-auto flex items-center justify-between p-4 rounded-2xl shadow-2xl active:scale-[0.98] transition-transform">
      <div class="flex items-center gap-3">
        <div class="bg-white/20 w-10 h-10 rounded-xl flex items-center justify-center text-xl">🛒</div>
        <div class="text-right">
          <p class="text-xs font-bold text-white/80">مشاهده سبد خرید</p>
          <p class="font-black" id="cart-total-price">۰ تومان</p>
        </div>
      </div>
      <div class="bg-white text-brand font-black w-8 h-8 rounded-full flex items-center justify-center shadow-sm" id="cart-item-count">۰</div>
    </button>
  </div>

  <!-- مودال سبد خرید -->
  <div id="cart-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden flex items-end justify-center p-0">
    <div class="bg-white w-full max-w-lg rounded-t-3xl shadow-2xl flex flex-col max-h-[85vh] slide-up-enter">
      <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-3xl">
        <h2 class="text-xl font-black text-slate-800">سبد خرید شما</h2>
        <button onclick="closeCartModal()" class="w-8 h-8 bg-slate-200 text-slate-600 rounded-full flex items-center justify-center">✕</button>
      </div>
      
      <div class="p-6 overflow-y-auto flex-1" id="cart-items-list">
        <!-- آیتم‌های سبد اینجا لود می‌شوند -->
      </div>

      <div class="p-6 border-t border-slate-100 bg-white">
        <div class="flex justify-between items-center mb-4">
          <span class="font-bold text-slate-600">جمع کل:</span>
          <span class="text-2xl font-black text-brand" id="cart-modal-total">۰ تومان</span>
        </div>
        <button class="w-full bg-brand text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-transform" onclick="alert('در نسخه‌های بعدی به پنل رستوران متصل می‌شود')">
          ثبت سفارش نهایی
        </button>
      </div>
    </div>
  </div>

  <!-- دکمه شناور فراخوان گارسون -->
  <button onclick="callWaiter()" class="fixed bottom-24 left-6 bg-white border border-slate-200 text-slate-700 px-4 py-2.5 rounded-full shadow-xl flex items-center gap-2 z-40 transition-transform hover:scale-105 active:scale-95 group">
    <span class="relative flex h-2.5 w-2.5">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
    </span>
    <span class="font-bold text-xs">فراخوان گارسون 🛎</span>
  </button>

  <!-- کانتینر اعلان‌ها (Toast) -->
  <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-[200] flex flex-col gap-2 pointer-events-none w-full max-w-xs px-4"></div>

    <script>
    const API_BASE = 'https://menuqr-8v3o.onrender.com/api';
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');

    let allCategories = [];
    let allItems = [];
    let activeCategory = 'all';
    let searchQuery = '';
    
    let currentItem = null;
    let currentQuantity = 1;
    let currentRating = 0;

    // متغیرهای سبد خرید
    let cart = JSON.parse(localStorage.getItem('restaurantCart') || '[]');

    window.onload = () => {
      const savedName = localStorage.getItem('customerName');
      if (!savedName) {
        document.getElementById('welcome-modal').classList.remove('hidden');
      } else {
        updateWelcomeMessage(savedName, localStorage.getItem('customerTable'));
      }
      fetchMenu();
      updateCartUI(); // آپدیت سبد خرید در بدو ورود
    };

    function saveCustomerInfo() {
      const name = document.getElementById('customer-name').value.trim();
      const table = document.getElementById('customer-table').value.trim();
      if (!name) return showToast('لطفا نام خود را وارد کنید.', 'error');
      localStorage.setItem('customerName', name);
      if (table) localStorage.setItem('customerTable', table);
      document.getElementById('welcome-modal').classList.add('hidden');
      updateWelcomeMessage(name, table);
    }

    function updateWelcomeMessage(name, table) {
      const el = document.getElementById('welcome-message');
      el.innerHTML = table ? `خوش آمدید <strong>${name}</strong> | میز <strong>${table}</strong>` : `خوش آمدید <strong>${name}</strong>`;
    }

    async function fetchMenu() {
      if (!slug) return;
      try {
        const res = await fetch(`${API_BASE}/public/menu/${slug}`); 
        if (!res.ok) throw new Error('منو پیدا نشد');
        const data = await res.json();
        
        document.getElementById('restaurant-name').innerText = data.restaurant.restaurantName || 'منوی رستوران';
        
        // 👑 اعمال رنگ اختصاصی رستوران (Dynamic Branding)
        if (data.restaurant.brandColor) {
          document.documentElement.style.setProperty('--brand-color', data.restaurant.brandColor);
        }

        allCategories = data.categories;
        allItems = [];
        data.categories.forEach(cat => {
          cat.items.forEach(item => {
            allItems.push({ ...item, categoryName: cat.name, categoryId: cat._id });
          });
        });
        renderCategoryTabs();
        filterAndRenderItems();
      } catch (error) {
        document.getElementById('menu-list').innerHTML = '<p class="text-center text-red-500 py-10">خطا در دریافت منو.</p>';
      }
    }

    function renderCategoryTabs() {
      const container = document.getElementById('category-tabs');
      let html = `<button onclick="setCategory('all')" class="whitespace-nowrap px-5 py-2.5 rounded-full text-sm font-bold transition-all ${activeCategory === 'all' ? 'bg-brand text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200'}">همه</button>`;
      allCategories.forEach(cat => {
        html += `<button onclick="setCategory('${cat._id}')" class="whitespace-nowrap px-5 py-2.5 rounded-full text-sm font-bold transition-all ${activeCategory === cat._id ? 'bg-brand text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200'}">${cat.name}</button>`;
      });
      container.innerHTML = html;
    }

    function setCategory(catId) {
      activeCategory = catId;
      renderCategoryTabs();
      filterAndRenderItems();
    }

    function renderTags(tags) {
      if (!tags || tags.length === 0) return '';
      const tagStyles = {
        'spicy': { label: 'تند 🌶', color: 'bg-red-100 text-red-600' },
        'vegetarian': { label: 'گیاهی 🌿', color: 'bg-green-100 text-green-600' },
        'popular': { label: 'محبوب ⭐', color: 'bg-orange-100 text-orange-600' },
        'gluten-free': { label: 'بدون گلوتن 🌾', color: 'bg-yellow-100 text-yellow-700' }
      };
      return tags.map(tag => {
        const style = tagStyles[tag] || { label: tag, color: 'bg-slate-100 text-slate-600' };
        return `<span class="px-2.5 py-1 rounded-md text-[11px] font-bold ${style.color}">${style.label}</span>`;
      }).join('');
    }

    function filterAndRenderItems() {
      const listContainer = document.getElementById('menu-list');
      const filteredItems = allItems.filter(item => {
        const matchCategory = activeCategory === 'all' || item.categoryId === activeCategory;
        const matchSearch = item.name.includes(searchQuery) || (item.description && item.description.includes(searchQuery));
        return matchCategory && matchSearch;
      });

      if (filteredItems.length === 0) {
        listContainer.innerHTML = '<p class="text-center text-slate-500 py-10">غذایی پیدا نشد.</p>';
        return;
      }

      listContainer.innerHTML = filteredItems.map(item => `
        <div onclick="openItemPage('${item._id}')" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex gap-4 items-center hover:shadow-md transition-shadow cursor-pointer active:scale-[0.98]">
          ${item.image ? `<img src="${item.image.startsWith('http') ? item.image : API_BASE.replace('/api','') + item.image}" loading="lazy" class="w-24 h-24 rounded-xl object-cover shadow-sm">` : `<div class="w-24 h-24 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400 text-xs">بدون عکس</div>`}
          <div class="flex-1">
            <h3 class="font-bold text-slate-800 text-lg">${item.name}</h3>
            <div class="flex gap-1 mt-1 mb-2 flex-wrap">${renderTags(item.tags)}</div>
            <p class="text-xs text-slate-500 line-clamp-2">${item.description || 'بدون توضیحات'}</p>
            <p class="font-extrabold text-brand mt-2">${item.price.toLocaleString()} تومان</p>
          </div>
        </div>
      `).join('');
    }

    function openItemPage(itemId) {
      currentItem = allItems.find(i => i._id === itemId);
      if (!currentItem) return;
      
      currentQuantity = 1;
      document.getElementById('qty-display').innerText = currentQuantity;
      updatePriceDisplay();

      const imgContainer = document.getElementById('item-image-container');
      if (currentItem.image) {
        imgContainer.innerHTML = `<img src="${currentItem.image.startsWith('http') ? currentItem.image : API_BASE.replace('/api','') + currentItem.image}" loading="lazy" class="w-full h-full object-cover">`;
      } else {
        imgContainer.innerHTML = `<div class="w-full h-full flex items-center justify-center text-slate-400">بدون عکس</div>`;
      }

      document.getElementById('item-title').innerText = currentItem.name;
      document.getElementById('item-description').innerText = currentItem.description || 'توضیحاتی برای این غذا ثبت نشده است.';
      document.getElementById('item-tags').innerHTML = renderTags(currentItem.tags);

      const ingredientsCont = document.getElementById('item-ingredients-container');
      if (currentItem.ingredients) {
        ingredientsCont.classList.remove('hidden');
        document.getElementById('item-ingredients').innerText = currentItem.ingredients;
      } else {
        ingredientsCont.classList.add('hidden');
      }

      const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
      const favBtn = document.getElementById('fav-btn');
      if (favorites.includes(currentItem._id)) {
        favBtn.classList.add('text-red-500'); favBtn.classList.remove('text-slate-400');
      } else {
        favBtn.classList.remove('text-red-500'); favBtn.classList.add('text-slate-400');
      }

      currentRating = parseInt(localStorage.getItem(`rating_${currentItem._id}`) || '0');
      updateStars(currentRating);

      const page = document.getElementById('item-page');
      page.classList.remove('hidden'); page.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }

    function closeItemPage() {
      const page = document.getElementById('item-page');
      page.classList.add('hidden'); page.classList.remove('flex');
      document.body.style.overflow = 'auto';
    }

    function changeQty(amount) {
      currentQuantity += amount;
      if (currentQuantity < 1) currentQuantity = 1;
      document.getElementById('qty-display').innerText = currentQuantity;
      updatePriceDisplay();
    }

    function updatePriceDisplay() {
      const total = currentItem.price * currentQuantity;
      document.getElementById('item-price').innerText = `${total.toLocaleString()} تومان`;
    }

    // 🛒 افزودن به سبد خرید
    function addToCart() {
      const existingItem = cart.find(i => i._id === currentItem._id);
      if (existingItem) {
        existingItem.qty += currentQuantity;
      } else {
        cart.push({ ...currentItem, qty: currentQuantity });
      }
      
      localStorage.setItem('restaurantCart', JSON.stringify(cart));
      updateCartUI();
      showToast(`${currentQuantity} عدد ${currentItem.name} به سبد اضافه شد ✅`, 'success');
      closeItemPage();
    }

    // آپدیت سبد خرید شناور
    function updateCartUI() {
      const cartBar = document.getElementById('floating-cart');
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      if (totalCount > 0) {
        cartBar.classList.remove('translate-y-24');
        document.getElementById('cart-item-count').innerText = totalCount;
        document.getElementById('cart-total-price').innerText = `${totalPrice.toLocaleString()} تومان`;
      } else {
        cartBar.classList.add('translate-y-24');
      }
    }

    // مودال سبد خرید
    function openCartModal() {
      const list = document.getElementById('cart-items-list');
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      
      if(cart.length === 0) {
         list.innerHTML = '<p class="text-center text-slate-500 py-4">سبد خرید شما خالی است.</p>';
      } else {
        list.innerHTML = cart.map((item, index) => `
          <div class="flex items-center justify-between py-3 border-b border-slate-100">
            <div class="flex items-center gap-3">
              <span class="w-6 h-6 bg-slate-100 rounded-md flex items-center justify-center text-xs font-bold text-slate-600">${item.qty}</span>
              <span class="font-bold text-slate-800 text-sm">${item.name}</span>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-xs font-bold text-slate-600">${(item.price * item.qty).toLocaleString()}</span>
              <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-600 text-sm">✕</button>
            </div>
          </div>
        `).join('');
      }

      document.getElementById('cart-modal-total').innerText = `${total.toLocaleString()} تومان`;
      document.getElementById('cart-modal').classList.remove('hidden');
    }

    function closeCartModal() {
      document.getElementById('cart-modal').classList.add('hidden');
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      localStorage.setItem('restaurantCart', JSON.stringify(cart));
      updateCartUI();
      openCartModal(); // رفرش مودال
    }

    function toggleFavorite() {
      let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
      const favBtn = document.getElementById('fav-btn');
      
      if (favorites.includes(currentItem._id)) {
        favorites = favorites.filter(id => id !== currentItem._id);
        favBtn.classList.remove('text-red-500'); favBtn.classList.add('text-slate-400');
      } else {
        favorites.push(currentItem._id);
        favBtn.classList.add('text-red-500'); favBtn.classList.remove('text-slate-400');
      }
      localStorage.setItem('favorites', JSON.stringify(favorites));
    }

    function rateItem(stars) {
      currentRating = stars;
      localStorage.setItem(`rating_${currentItem._id}`, stars);
      updateStars(stars);
    }

    function updateStars(rating) {
      const stars = document.querySelectorAll('#rating-stars span');
      stars.forEach((star, index) => {
        if (index < rating) {
          star.classList.add('text-yellow-400'); star.classList.remove('text-slate-300');
        } else {
          star.classList.remove('text-yellow-400'); star.classList.add('text-slate-300');
        }
      });
    }

    // 🛎 فراخوان گارسون با اعلان شیک (Toast)
    function callWaiter() {
      const name = localStorage.getItem('customerName') || 'مشتری';
      const table = localStorage.getItem('customerTable') || 'نامشخص';
      
      showToast(`گارسون به میز شما (${table}) خواهد آمد، ${name} عزیز 🛎`, 'success');
    }

    // سیستم اعلان (Toast)
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast-enter bg-white border px-4 py-3 rounded-xl shadow-lg flex items-center gap-3 text-sm font-bold ${type === 'success' ? 'border-green-200 text-green-700' : 'border-red-200 text-red-700'}`;
      toast.innerHTML = `
        <span class="text-xl">${type === 'success' ? '✅' : '❌'}</span>
        <span>${message}</span>
      `;
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-20px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      filterAndRenderItems();
    });

    document.getElementById('theme-toggle').addEventListener('click', function() {
      document.body.classList.toggle('dark-mode');
      this.innerText = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    });
  </script>
</body>
</html>
