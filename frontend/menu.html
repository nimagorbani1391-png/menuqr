<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منوی رستوران</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen text-slate-800 antialiased pb-10">

  <!-- هدر رستوران -->
  <header class="bg-indigo-600 text-white p-6 rounded-b-3xl shadow-lg mb-6">
    <div class="max-w-2xl mx-auto text-center">
      <h1 class="text-2xl font-extrabold" id="restaurant-name">در حال بارگذاری...</h1>
      <p class="text-indigo-200 mt-2 text-sm">به منوی ما خوش آمدید 🌿</p>
    </div>
  </header>

  <!-- بخش دسته‌بندی‌ها -->
  <div class="max-w-2xl mx-auto px-4">
    <div id="categories-container" class="flex overflow-x-auto gap-2 mb-6 pb-2 scrollbar-hide">
      <!-- دسته‌بندی‌ها اینجا لود می‌شن -->
    </div>

    <!-- لیست غذاها -->
    <div id="menu-list" class="space-y-4">
      <p class="text-center text-slate-500 py-10">در حال دریافت منو...</p>
    </div>
  </div>

  <script>
    const API_BASE = 'https://menuqr-8v3o.onrender.com/api';
    // ما فعلا از آیدی رستوران تست استفاده می‌کنیم (چون هنوز لینک اختصاصی نساختیم)
    // بعدا این رو با آیدی واقعی رستوران تو عوض می‌کنیم
    const urlParams = new URLSearchParams(window.location.search);
    const restaurantId = urlParams.get('r') || 'test-id'; 

    // گرفتن اطلاعات منو
    async function fetchMenu() {
      try {
        // ⚠️ این آدرس رو با توجه به بک‌اند تنظیم کردیم
        const res = await fetch(`${API_BASE}/public/menu/${restaurantId}`); 
        
        // اگه بک‌اند ما این آدرس رو نداشت، یه ارور می‌ده که فعلا هندل می‌کنیم
        if (!res.ok) throw new Error('not found');
        
        const data = await res.json();
        
        // نمایش اسم رستوران
        document.getElementById('restaurant-name').innerText = data.restaurantName || 'منوی رستوران';
        
        renderMenu(data.categories, data.items);
      } catch (error) {
        // چون آیدی تست هست، فعلا یه حالت دمو نشون می‌دیم تا ظاهر رو ببینی
        document.getElementById('restaurant-name').innerText = 'کافه رستوران نیما';
        renderDemo();
      }
    }

    function renderMenu(categories, items) {
      const catContainer = document.getElementById('categories-container');
      const listContainer = document.getElementById('menu-list');

      // نمایش دسته‌بندی‌ها
      catContainer.innerHTML = categories.map(c => `
        <button class="whitespace-nowrap px-4 py-2 rounded-full bg-white border border-slate-200 text-sm font-medium hover:bg-indigo-50 transition-colors">
          ${c.name}
        </button>
      `).join('');

      // نمایش غذاها
      if(items.length === 0) {
         listContainer.innerHTML = '<p class="text-center text-slate-500">هنوز غذایی ثبت نشده است.</p>';
         return;
      }

      listContainer.innerHTML = items.map(item => `
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex gap-4 items-center">
          ${item.image 
            ? `<img src="https://menuqr-8v3o.onrender.com${item.image}" class="w-24 h-24 rounded-xl object-cover shadow-sm">` 
            : `<div class="w-24 h-24 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400">بدون عکس</div>`}
          <div class="flex-1">
            <h3 class="font-bold text-slate-800 text-lg">${item.name}</h3>
            <p class="text-xs text-slate-500 mt-1 line-clamp-2">${item.description || 'بدون توضیحات'}</p>
            <p class="font-extrabold text-indigo-600 mt-2">${item.price.toLocaleString()} تومان</p>
          </div>
        </div>
      `).join('');
    }

    // یه دمو برای اینکه ببینی ظاهرش چطوره
    function renderDemo() {
        const demoCats = [{name: 'غذای اصلی'}, {name: 'نوشیدنی'}, {name: 'دسر'}];
        const demoItems = [
            { name: 'کباب کوبیده گوسفندی', price: 250000, description: 'گوشت گوسفندی تازه با برنج ایرانی و کره', image: '' },
            { name: 'پیتزا پپرونی', price: 180000, description: 'خمیر تازه، سس مخصوص، پنیر موزارلا', image: '' }
        ];
        renderMenu(demoCats, demoItems);
    }

    fetchMenu();
  </script>
</body>
</html>
