<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منوی رستوران</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen text-slate-800 antialiased pb-10">

  <header class="bg-indigo-600 text-white p-6 rounded-b-3xl shadow-lg mb-6">
    <div class="max-w-2xl mx-auto text-center">
      <h1 class="text-2xl font-extrabold" id="restaurant-name">در حال بارگذاری...</h1>
      <p class="text-indigo-200 mt-2 text-sm">به منوی ما خوش آمدید 🌿</p>
    </div>
  </header>

  <div class="max-w-2xl mx-auto px-4">
    <div id="menu-list" class="space-y-6">
      <p class="text-center text-slate-500 py-10">در حال دریافت منو...</p>
    </div>
  </div>

  <script>
    const API_BASE = 'https://menuqr-8v3o.onrender.com/api';
    
    // گرفتن slug از آدرس سایت (مثل: menu.html?slug=abc123)
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');

    async function fetchMenu() {
      if (!slug) {
        document.getElementById('restaurant-name').innerText = 'خطا در لینک';
        document.getElementById('menu-list').innerHTML = '<p class="text-center text-red-500 py-10">لطفا با لینک اختصاصی رستوران وارد شوید (پارامتر slug وجود ندارد).</p>';
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/public/menu/${slug}`); 
        
        if (!res.ok) throw new Error('منو پیدا نشد');
        
        const data = await res.json();
        
        // نمایش اسم رستوران
        document.getElementById('restaurant-name').innerText = data.restaurant.restaurantName || 'منوی رستوران';
        
        renderMenu(data.categories);
      } catch (error) {
        document.getElementById('menu-list').innerHTML = '<p class="text-center text-red-500 py-10">خطا: منویی با این آدرس پیدا نشد.</p>';
      }
    }

    function renderMenu(categories) {
      const listContainer = document.getElementById('menu-list');

      if(categories.length === 0) {
         listContainer.innerHTML = '<p class="text-center text-slate-500">هنوز غذایی به منو اضافه نشده است.</p>';
         return;
      }

      // رندر کردن دسته‌بندی‌ها و غذاهای هر دسته
      listContainer.innerHTML = categories.map(cat => `
        <div class="mb-8">
          <h2 class="text-lg font-extrabold text-indigo-900 mb-4 border-b border-indigo-100 pb-2">${cat.name}</h2>
          <div class="space-y-4">
            ${cat.items.map(item => `
              <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex gap-4 items-center">
                ${item.image 
                  ? `<img src="https://menuqr-8v3o.onrender.com${item.image}" class="w-24 h-24 rounded-xl object-cover shadow-sm">` 
                  : `<div class="w-24 h-24 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400 text-xs">بدون عکس</div>`}
                <div class="flex-1">
                  <h3 class="font-bold text-slate-800 text-lg">${item.name}</h3>
                  <p class="text-xs text-slate-500 mt-1 line-clamp-2">${item.description || 'بدون توضیحات'}</p>
                  <p class="font-extrabold text-indigo-600 mt-2">${item.price.toLocaleString()} تومان</p>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    fetchMenu();
  </script>
</body>
</html>
