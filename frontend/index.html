<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MenuQR | پنل مدیریت</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; background-color: #f8fafc; }
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen text-slate-800 antialiased">

  <div id="auth-section" class="flex items-center justify-center min-h-screen px-4 bg-gradient-to-br from-indigo-50 to-slate-100">
    <div class="bg-white/80 backdrop-blur-xl p-8 rounded-3xl shadow-2xl shadow-indigo-100/50 border border-white/50 w-full max-w-md">
      
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-200">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        </div>
        <h2 class="text-2xl font-extrabold text-slate-800 tracking-tight" id="auth-title">ورود به MenuQR</h2>
        <p class="text-sm text-slate-500 mt-2 font-medium">پنل مدیریت رستوران</p>
      </div>
      
      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">ایمیل</label>
          <input type="email" id="email" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none text-sm text-left" dir="ltr" placeholder="example@gmail.com">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">رمز عبور</label>
          <input type="password" id="password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none text-sm text-left" dir="ltr" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-500/30 transition-all active:scale-[0.98]">ورود به پنل</button>
      </form>

      <form id="register-form" class="space-y-4 hidden">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">نام و نام خانوادگی</label>
          <input type="text" id="reg-name" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none text-sm" placeholder="مثلا: نیما قربانی">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">اسم رستوران</label>
          <input type="text" id="reg-restaurant" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none text-sm" placeholder="مثلا: رستوران سنتی نیما">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">ایمیل</label>
          <input type="email" id="reg-email" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none text-sm text-left" dir="ltr" placeholder="example@gmail.com">
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">رمز عبور</label>
          <input type="password" id="reg-password" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none text-sm text-left" dir="ltr" placeholder="حداقل ۶ کاراکتر">
        </div>
        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-green-500/30 transition-all active:scale-[0.98] mt-2">ساخت حساب جدید</button>
      </form>

      <div class="mt-6 text-center">
        <button id="toggle-auth" class="text-sm text-indigo-600 font-bold hover:underline">حساب ندارید؟ ثبت‌نام کنید</button>
      </div>

      <p id="auth-error" class="text-red-500 text-sm font-medium text-center mt-4 hidden bg-red-50 py-2 rounded-lg"></p>
    </div>
  </div>

  <div id="dashboard-section" class="hidden max-w-5xl mx-auto p-4 md:p-8">
    <div class="flex justify-between items-center mb-8 bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-100">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center font-bold text-xl">M</div>
        <div>
          <h1 class="text-xl font-extrabold text-slate-800">مدیریت منو</h1>
          <p class="text-xs text-slate-500 font-medium">MenuQR by NIMEX</p>
        </div>
      </div>
      <button onclick="logout()" class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-4 py-2 rounded-xl text-sm font-bold transition-colors">خروج از حساب</button>
    </div>

    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 mb-8">
      <h2 class="text-lg font-extrabold text-slate-800 mb-6 flex items-center gap-2">
        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
        ساخت دسته‌بندی جدید
      </h2>
      <form id="category-form" class="flex gap-3">
        <input type="text" id="cat-name" placeholder="مثلا: پیش‌غذا، نوشیدنی..." required class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none text-sm">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg shadow-indigo-500/30 transition-all active:scale-[0.98]">افزودن</button>
      </form>
    </div>

    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 mb-8">
      <h2 class="text-lg font-extrabold text-slate-800 mb-6 flex items-center gap-2">
        <svg class="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        افزودن غذای جدید
      </h2>
      <form id="item-form" class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">نام غذا</label>
          <input type="text" id="item-name" placeholder="مثلا: کباب کوبیده" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">قیمت (تومان)</label>
          <input type="number" id="item-price" placeholder="مثلا: 250000" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">دسته‌بندی</label>
          <select id="item-cat" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none text-sm">
            <option value="">لطفا یک دسته‌بندی انتخاب کنید...</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">عکس غذا</label>
          <input type="file" id="item-image" accept="image/*" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition-all">
        </div>
        <div class="md:col-span-2">
          <label class="block text-xs font-semibold text-slate-600 mb-1">توضیحات (اختیاری)</label>
          <textarea id="item-desc" rows="2" placeholder="مواد اولیه، نکات..." class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none text-sm resize-none"></textarea>
        </div>
        <button type="submit" class="md:col-span-2 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-green-500/30 transition-all active:scale-[0.98] mt-2">افزودن به منو</button>
      </form>
    </div>

    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100">
      <h2 class="text-lg font-extrabold text-slate-800 mb-6 flex items-center gap-2">
        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
        لیست غذاهای فعلی
      </h2>
      <div id="items-list" class="space-y-3">
        <p class="text-slate-400 text-center font-medium py-4">در حال بارگذاری...</p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://menuqr-8v3o.onrender.com/api'; 
    let token = localStorage.getItem('menuqr_token');

    if (token) showDashboard();

    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const authTitle = document.getElementById('auth-title');
    const toggleAuthBtn = document.getElementById('toggle-auth');

    toggleAuthBtn.addEventListener('click', () => {
      document.getElementById('auth-error').classList.add('hidden');
      if(loginForm.classList.contains('hidden')) {
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        authTitle.innerText = 'ورود به MenuQR';
        toggleAuthBtn.innerText = 'حساب ندارید؟ ثبت‌نام کنید';
      } else {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        authTitle.innerText = 'ثبت‌نام در MenuQR';
        toggleAuthBtn.innerText = 'حساب دارید؟ وارد شوید';
      }
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      const err = document.getElementById('auth-error');
      btn.innerText = 'در حال ساخت...'; btn.disabled = true; err.classList.add('hidden');

      try {
        const res = await fetch(`${API_BASE}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            name: document.getElementById('reg-name').value,
            restaurantName: document.getElementById('reg-restaurant').value, // فیلد جدید
            email: document.getElementById('reg-email').value, 
            password: document.getElementById('reg-password').value 
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'خطا در ثبت‌نام');
        
        alert('حساب ساخته شد! حالا وارد شوید.');
        toggleAuthBtn.click(); 
        document.getElementById('email').value = document.getElementById('reg-email').value;
      } catch (error) {
        err.innerText = error.message; err.classList.remove('hidden');
      } finally {
        btn.innerText = 'ساخت حساب جدید'; btn.disabled = false;
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      const err = document.getElementById('auth-error');
      btn.innerText = 'در حال بررسی...'; btn.disabled = true; err.classList.add('hidden');

      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            email: document.getElementById('email').value, 
            password: document.getElementById('password').value 
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || 'خطا در ورود');
        
        token = data.token;
        localStorage.setItem('menuqr_token', token);
        showDashboard();
      } catch (error) {
        err.innerText = error.message; err.classList.remove('hidden');
      } finally {
        btn.innerText = 'ورود به پنل'; btn.disabled = false;
      }
    });

    function showDashboard() {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('dashboard-section').classList.remove('hidden');
      fetchCategories();
      fetchItems();
    }

    function logout() {
      localStorage.removeItem('menuqr_token');
      token = null;
      location.reload();
    }

    async function fetchCategories() {
      const select = document.getElementById('item-cat');
      try {
        const res = await fetch(`${API_BASE}/categories`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401) { logout(); return; }
        
        const cats = await res.json();
        select.innerHTML = '<option value="">لطفا یک دسته‌بندی انتخاب کنید...</option>' + 
          cats.map(c => `<option value="${c._id}">${c.name}</option>`).join('');
      } catch (e) {
        console.error('خطا در گرفتن دسته‌بندی‌ها');
      }
    }

    document.getElementById('category-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('cat-name').value;
      const btn = e.target.querySelector('button');
      btn.innerText = '...'; btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/categories`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify({ name })
        });
        if (!res.ok) throw new Error('خطا در ساخت دسته‌بندی');
        
        document.getElementById('cat-name').value = '';
        fetchCategories();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.innerText = 'افزودن'; btn.disabled = false;
      }
    });

    async function fetchItems() {
      const list = document.getElementById('items-list');
      try {
        const res = await fetch(`${API_BASE}/items`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.status === 401) { logout(); return; }
        
        const items = await res.json();
        if (items.length === 0) {
          list.innerHTML = '<p class="text-slate-400 text-center font-medium py-4">هنوز غذایی به منو اضافه نکردی.</p>';
          return;
        }

        list.innerHTML = items.map(item => `
          <div class="flex items-center justify-between p-3 hover:bg-slate-50 rounded-2xl border border-transparent hover:border-slate-100 transition-all group">
            <div class="flex items-center gap-4">
              ${item.image 
                ? `<img src="https://menuqr-8v3o.onrender.com${item.image}" class="w-14 h-14 rounded-xl object-cover shadow-sm group-hover:scale-105 transition-transform">` 
                : `<div class="w-14 h-14 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg></div>`}
              <div>
                <p class="font-bold text-slate-800 text-sm ${!item.isActive ? 'text-slate-400 line-through' : ''}">${item.name}</p>
                <p class="text-xs font-semibold text-indigo-600 mt-1">${item.price.toLocaleString()} تومان</p>
              </div>
            </div>
            <div class="flex gap-2">
              <button onclick="toggleItem('${item._id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-colors ${item.isActive ? 'bg-orange-50 text-orange-600 hover:bg-orange-100' : 'bg-green-50 text-green-600 hover:bg-green-100'}">
                ${item.isActive ? 'ناموجود کن' : 'موجود کن'}
              </button>
              <button onclick="deleteItem('${item._id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-red-50 text-red-600 hover:bg-red-100 transition-colors">
                حذف
              </button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        list.innerHTML = '<p class="text-red-500 text-center font-medium py-4">خطا در برقراری ارتباط با سرور</p>';
      }
    }

    document.getElementById('item-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('name', document.getElementById('item-name').value);
      formData.append('price', document.getElementById('item-price').value);
      formData.append('category', document.getElementById('item-cat').value);
      formData.append('description', document.getElementById('item-desc').value);
      
      const imageFile = document.getElementById('item-image').files[0];
      if (imageFile) formData.append('image', imageFile);

      const btn = e.target.querySelector('button[type="submit"]');
      const originalText = btn.innerText;
      btn.innerText = 'در حال ذخیره...'; btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/items`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData
        });
        if (!res.ok) {
           const d = await res.json();
           throw new Error(d.message || 'خطا');
        }
        e.target.reset();
        fetchItems();
      } catch (err) {
        alert('خطا: ' + err.message);
      } finally {
        btn.innerText = originalText; btn.disabled = false;
      }
    });

    async function toggleItem(id) {
      try {
        await fetch(`${API_BASE}/items/${id}/toggle`, {
          method: 'PATCH',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        fetchItems();
      } catch (e) { alert('خطا در تغییر وضعیت'); }
    }

    async function deleteItem(id) {
      if (!confirm('مطمئنی می‌خوای این غذا رو پاک کنی؟')) return;
      try {
        await fetch(`${API_BASE}/items/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        fetchItems();
      } catch (e) { alert('خطا در حذف'); }
    }
  </script>
</body>
</html>
